# Thunder ERP — sade self-hosted Supabase stack
#
# Sadece uygulamanın kullandığı servisler: Postgres + PostgREST + Realtime + Kong.
# Auth (GoTrue), Storage, Edge Functions, Analytics, Studio YOK.
#
# Tüm portlar 127.0.0.1'e bağlı — dışarıdan erişim yok:
#   - Kong     127.0.0.1:8000  → Next.js sunucusu (REST) + Nginx (sadece /realtime/v1/)
#   - Postgres 127.0.0.1:5432  → yedekleme / SSH tüneli ile yönetim
#
# Kullanım: cd deploy/supabase && cp .env.example .env && (değerleri doldur) && docker compose up -d

name: thunder-supabase

services:
  db:
    container_name: supabase-db
    image: supabase/postgres:${POSTGRES_IMAGE_TAG:-15.8.1.060}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - db-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      # Plan 8 GB ama hipervizör balloon ile ~5 GB geri alıyor (efektif ~2.5-3 GB).
      # Değerler buna göre muhafazakâr; balloon kalkarsa shared_buffers=1GB, effective_cache_size=3GB yapılabilir.
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
    shm_size: 256mb

  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:${POSTGREST_IMAGE_TAG:-v12.2.12}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  realtime:
    # Container adı tenant çözümlemesi için bu formatta OLMALI (SEED_SELF_HOST tenant'ı: realtime-dev)
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:${REALTIME_IMAGE_TAG:-v2.34.47}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD", "curl", "-sSfL", "--head", "-o", "/dev/null",
          "-H", "Authorization: Bearer ${SUPABASE_ANON_KEY}",
          "http://localhost:4000/api/tenants/realtime-dev/health",
        ]
      timeout: 5s
      interval: 10s
      retries: 3
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  kong:
    container_name: supabase-kong
    image: kong:${KONG_IMAGE_TAG:-2.8.1}
    restart: unless-stopped
    depends_on:
      - rest
      - realtime
    ports:
      - "127.0.0.1:${KONG_HTTP_PORT:-8000}:8000/tcp"
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    # kong.yml içindeki $SUPABASE_* değişkenlerini doldurup başlat
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'

volumes:
  db-data:
