# Thunder ERP — her proxy location'ında include edilir.
# Nginx'te bir location kendi proxy_set_header'ını tanımlarsa üst seviyedekileri MİRAS ALMAZ;
# bu yüzden ortak header'lar tek dosyada tutulup her yerde açıkça include ediliyor.
# X-Real-IP client değerini ezer (uygulamanın login rate-limit'i buna güvenir).
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
