# Thunder ERP — Nginx (IP üzerinden HTTPS, Let's Encrypt IP sertifikası)
# Kurulum: deploy/scripts/setup-tls.sh bu dosyayı ve thunder-proxy-headers.conf'u kopyalar.
#
# Dışarı açılanlar:
#   :80   /.well-known/acme-challenge/  → sertifika doğrulama (webroot)
#   :80   diğer her şey                 → https'e 301
#   :443  /                             → Next.js (127.0.0.1:3000)
#   :443  /realtime/v1/                 → Supabase Kong (127.0.0.1:8000) — SADECE geçerli thunder_token ile
# Açılmayanlar: /rest/v1 (PostgREST), Postgres, Kong admin — hepsi localhost'ta kalır.
#
# HSTS bilerek YOK: sertifika 6 günlük (shortlived); yenileme aksarsa HSTS kullanıcıları kilitler.

limit_req_zone $binary_remote_addr zone=thunder_login:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: sadece ACME doğrulaması + HTTPS'e yönlendirme ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    # nginx 1.24 (Ubuntu 24.04): `http2 on;` direktifi 1.25.1+; burada listen parametresi kullanılır
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/thunder-tls/fullchain.pem;
    ssl_certificate_key /etc/thunder-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:thunder_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/thunder-erp-access.log;
    error_log  /var/log/nginx/thunder-erp-error.log warn;

    # --- Login: Nginx seviyesinde de hız sınırı (uygulama içi limitere ek) ---
    location = /api/auth/login {
        limit_req zone=thunder_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/thunder-proxy-headers.conf;
    }

    # --- Realtime websocket: önce login kontrolü ---
    location /realtime/v1/ {
        auth_request /_auth_check;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/thunder-proxy-headers.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Realtime REST API'si (broadcast vb.) dışarı kapalı
    location /realtime/v1/api {
        return 404;
    }

    # PostgREST ve diğer Supabase path'leri asla dışarı açılmaz
    location ~ ^/(rest|auth|storage|pg|functions)/v1/ {
        return 404;
    }

    # auth_request alt isteği — cookie'yi Next.js'e iletir, gövde göndermez
    location = /_auth_check {
        internal;
        proxy_pass http://127.0.0.1:3000/api/auth/verify;
        proxy_pass_request_body off;
        include /etc/nginx/snippets/thunder-proxy-headers.conf;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # --- Next.js statik dosyalar (immutable) ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/thunder-proxy-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Uygulama ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/thunder-proxy-headers.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
