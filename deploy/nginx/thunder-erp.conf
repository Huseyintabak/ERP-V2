# Thunder ERP — Nginx (IP üzerinden HTTP)
# Kurulum: setup-vps.sh bunu /etc/nginx/sites-available/thunder-erp olarak kopyalar.
#
# Dışarı açılanlar:
#   /                → Next.js (127.0.0.1:3000)
#   /realtime/v1/    → Supabase Kong (127.0.0.1:8000) — SADECE geçerli thunder_token ile (auth_request)
# Açılmayanlar: /rest/v1 (PostgREST), Postgres, Kong admin — hepsi localhost'ta kalır.

limit_req_zone $binary_remote_addr zone=thunder_login:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/thunder-erp-access.log;
    error_log  /var/log/nginx/thunder-erp-error.log warn;

    # Ortak proxy header'ları — X-Real-IP client değerini EZER (rate-limit buna güvenir)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Login: Nginx seviyesinde de hız sınırı (uygulama içi limitere ek) ---
    location = /api/auth/login {
        limit_req zone=thunder_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    # --- Realtime websocket: önce login kontrolü ---
    location /realtime/v1/ {
        auth_request /_auth_check;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Realtime REST API'si (broadcast vb.) dışarı kapalı
    location /realtime/v1/api {
        return 404;
    }

    # PostgREST ve diğer Supabase path'leri asla dışarı açılmaz
    location ~ ^/(rest|auth|storage|pg|functions)/v1/ {
        return 404;
    }

    # auth_request alt isteği — cookie'yi Next.js'e iletir, gövde göndermez
    location = /_auth_check {
        internal;
        proxy_pass http://127.0.0.1:3000/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # --- Next.js statik dosyalar (immutable) ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Uygulama ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
